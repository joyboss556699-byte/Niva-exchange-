<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVA EXCHANGE 💦</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root{
            --bg:#17181b;
            --surface:#252629;
            --surface-2:#2b2c30;
            --border:rgba(255,255,255,.14);
            --text:#f7f7f9;
            --muted:#9b9ca5;
            --blue:#31b8f4;
            --purple:#9b70ff;
            --pink:#ff69b4;
            --green:#35d39a;
            --danger:#ff5d73;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{min-height:100%;background:var(--bg)}
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            color:var(--text);
            padding:0 18px 100px;
            overflow-x:hidden;
            background:
              radial-gradient(circle at 10% 0%,rgba(74,46,110,.28),transparent 32%),
              linear-gradient(180deg,#191a1d 0%,#151619 100%);
        }
        button,input{font:inherit}
        button{border:0}
        .header{
            margin:0 -18px 18px;
            padding:14px 18px 16px;
            background:#202d3a;
            border-bottom:1px solid rgba(255,255,255,.06);
            text-align:left;
        }
        .header h1{
            font-size:20px;
            font-weight:800;
            letter-spacing:-.3px;
            text-align:center;
        }
        .status{display:none}
        .mail-info{display:none}

        .profile-card{
            display:flex;align-items:center;gap:14px;
            margin:0 0 20px;
            padding:14px;
            border-radius:24px;
            background:linear-gradient(135deg,#73527f,#866493);
            box-shadow:0 12px 28px rgba(0,0,0,.2);
        }
        .avatar{
            width:76px;height:76px;border-radius:18px;flex:0 0 76px;
            display:grid;place-items:center;
            background:#64658f;border:2px solid rgba(255,255,255,.5);
            color:#fff;font-size:34px;overflow:hidden;
        }
        .profile-main{min-width:0;flex:1}
        .profile-name{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .profile-user{font-size:14px;color:#e5d9e9;margin-top:2px}
        .debug{font-size:10px;color:#cdbbd2;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .approved{
            min-width:96px;padding:9px 12px;border:1px solid rgba(255,255,255,.3);
            border-radius:15px;text-align:center;background:rgba(255,255,255,.1)
        }
        .approved small{display:block;font-size:10px;letter-spacing:2px;font-weight:800;color:#eee}
        .approved strong{font-size:30px;line-height:1.1}

        .section{
            background:transparent;
            padding:0;
            margin:0 0 20px;
            border-radius:0;
        }
        .section-title{
            margin:0 0 11px;
            padding-left:10px;
            border-left:4px solid var(--blue);
            color:#45b9ef;
            font-size:13px;
            letter-spacing:1.5px;
            font-weight:900;
            text-transform:uppercase;
        }
        .quick-grid{
            display:grid;grid-template-columns:1fr 1fr;gap:14px
        }
        .quick-btn{
            min-height:84px;padding:12px 14px;
            border:1px solid var(--border);
            border-radius:20px;
            background:var(--surface);
            color:var(--text);
            display:flex;align-items:center;gap:12px;
            text-align:left;cursor:pointer;
            box-shadow:0 6px 18px rgba(0,0,0,.12);
        }
        .quick-btn.wide{grid-column:1/-1}
        .quick-btn.accent{border-color:#9a72ff;background:linear-gradient(135deg,#262231,#202027)}
        .quick-icon{
            width:50px;height:50px;border-radius:14px;display:grid;place-items:center;
            font-size:27px;background:#153c4d;flex:0 0 50px
        }
        .quick-btn:nth-child(2) .quick-icon{background:#30204b}
        .quick-btn:nth-child(3) .quick-icon{background:#a575ff}
        .quick-btn:nth-child(4) .quick-icon{background:#2eaedc}
        .quick-btn:nth-child(5) .quick-icon{background:#f16ab6}
        .quick-text b{display:block;font-size:17px}
        .quick-text span{display:block;color:#a7a7ae;font-size:13px;margin-top:2px}

        .coin-grid{display:block;margin:0}
        .coin-card{
            position:relative;
            margin-bottom:14px;
            padding:22px 24px 20px;
            min-height:190px;
            border:1px solid rgba(255,255,255,.13);
            border-radius:24px;
            background:var(--surface);
            cursor:pointer;
            transition:.2s;
            box-shadow:0 8px 24px rgba(0,0,0,.2);
        }
        .coin-card:hover{transform:translateY(-1px)}
        .coin-card.selected{border-color:#9a72ff;box-shadow:0 0 0 1px rgba(154,114,255,.25),0 10px 28px rgba(0,0,0,.25)}
        .coin-head{display:flex;align-items:center;gap:16px}
        .coin-icon{
            width:70px;height:70px;border-radius:18px;display:grid;place-items:center;
            background:linear-gradient(135deg,#ec4c82,#bc268b);font-size:39px;flex:0 0 70px
        }
        .coin-name{font-size:24px;font-weight:900;letter-spacing:-.5px}
        .coin-sub{font-size:12px;letter-spacing:2px;color:#999aa2;margin-top:2px}
        .online{
            margin-left:auto;padding:7px 13px;border-radius:18px;
            color:var(--green);border:1px solid rgba(53,211,154,.3);
            background:rgba(53,211,154,.08);font-size:11px;font-weight:800
        }
        .online.off{color:#ff6879;border-color:rgba(255,104,121,.3);background:rgba(255,104,121,.08)}
        .sell-btn{
            width:100%;margin-top:18px;padding:12px;border-radius:15px;
            color:var(--green);background:rgba(53,211,154,.12);
            border:1px solid rgba(53,211,154,.35);font-weight:900;font-size:17px
        }
        .coin-card.disabled{opacity:.48;cursor:not-allowed}
        .coin-card.disabled .sell-btn{color:#aaa}
        .input-field{
            width:100%;padding:14px 15px;margin:0 0 14px;
            border:1px solid var(--border);border-radius:14px;
            background:#242529;color:#fff;outline:none
        }
        .input-field:focus{border-color:#8f68ff}
        .payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
        .payment-btn{
            padding:13px;border-radius:13px;background:#292a2e;color:#fff;
            border:1px solid var(--border);cursor:pointer
        }
        .payment-btn.active{border-color:#9a72ff;background:#32294a}
        .payment-btn.disabled{opacity:.4;cursor:not-allowed}
        .file-upload{margin-bottom:14px}
        .file-upload label{display:block;margin-bottom:7px;font-size:13px;color:#bbb}
        .file-upload input[type=file]{width:100%;padding:12px;border-radius:14px;background:#242529;color:#bbb}
        .rate-display{
            padding:16px;border-radius:18px;background:#242529;border:1px solid var(--border);
            margin:10px 0 14px;text-align:center
        }
        .rate-display h3{font-size:12px;letter-spacing:1.5px;color:#aaa;margin-bottom:7px}
        .total-amount{font-size:22px;color:var(--green);font-weight:900}
        .submit-btn{
            width:100%;padding:15px;border-radius:15px;background:linear-gradient(135deg,#9c72ff,#6f4eea);
            color:#fff;font-weight:900;font-size:16px;cursor:pointer
        }
        .submit-btn.disabled{opacity:.4;cursor:not-allowed}
        .menu-section{display:none}
        .bottom-nav{
            position:fixed;z-index:50;left:18px;right:18px;bottom:10px;
            display:grid;grid-template-columns:repeat(6,1fr);gap:3px;
            padding:8px 5px;border:1px solid rgba(255,255,255,.1);
            border-radius:22px;background:rgba(31,32,35,.96);
            backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)
        }
        .bottom-nav button{
            padding:6px 2px;border-radius:14px;background:transparent;color:#999aa2;
            font-size:10px;font-weight:800;cursor:pointer
        }
        .bottom-nav button.active{color:#36b8ef;background:rgba(49,184,244,.1)}
        .bottom-nav .nav-icon{display:block;font-size:20px;line-height:22px;margin-bottom:2px}
        .admin-btn{background:linear-gradient(135deg,#ffd75a,#ffad35)!important;color:#191a1d!important}
        .hidden{display:none}
        .info-box{padding:11px 13px;margin:0 0 14px;border-radius:13px;background:#222328;color:#bdbec5;font-size:12px}
        .form-label{display:block;margin:0 0 7px;font-size:13px;color:#bbb;font-weight:700}
        .admin-note{margin-top:8px;color:#888;font-size:11px}
        @media(max-width:390px){
            body{padding-left:13px;padding-right:13px}
            .header{margin-left:-13px;margin-right:-13px}
            .coin-name{font-size:20px}
            .online{padding:6px 8px}
            .bottom-nav{left:8px;right:8px}
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="appName">NIVA EXCHANGE 💦</h1>
    </div>

    <div class="profile-card">
        <div class="avatar">👤</div>
        <div class="profile-main">
            <div class="profile-name" id="profileName">Python devaloper</div>
            <div class="profile-user" id="profileUsername">@Devalopar</div>
            <div class="debug" id="debugInfo">[debug] TG SDK: found</div>
        </div>
        <div class="approved">
            <small>APPROVED</small>
            <strong id="approvedCount">0</strong>
        </div>
    </div>

    <div class="section">
        <div class="section-title">QUICK ACCESS</div>
        <div class="quick-grid">
            <button class="quick-btn" onclick="openLink('https://t.me/Sapportotp')">
                <span class="quick-icon">🎧</span>
                <span class="quick-text"><b>Help Line</b><span>24/7 Support</span></span>
            </button>
            <button class="quick-btn" onclick="openLink('https://t.me/yourchannel')">
                <span class="quick-icon">📢</span>
                <span class="quick-text"><b>Channel</b><span>News &amp; Updates</span></span>
            </button>
        </div>
    </div>

    <div class="section" id="xr7TaskSection">
        <div class="section-title">LIVE MARKET <span style="color:#35d39a">●</span></div>
        <div id="coinGrid"></div>

        <div id="taskForm">
            <div class="info-box" id="coinInfoBox">📋 ইউজারনেম কপি করুন</div>

            <label class="form-label">Instagram ইউজারনেম *</label>
            <input type="text" class="input-field" id="instagramUsername" placeholder="আপনার Instagram ইউজারনেম দিন">

            <label class="form-label">পরিমাণ (কয়েন সংখ্যা)</label>
            <input type="number" class="input-field" id="quantity" value="1000" min="1" placeholder="কয়েন সংখ্যা লিখুন" oninput="calculateTotal()">

            <label class="form-label">পেমেন্ট মেথড</label>
            <div class="payment-methods" id="paymentMethods"></div>

            <label class="form-label">অ্যাকাউন্ট নাম্বার</label>
            <input type="text" class="input-field" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার">

            <label class="form-label" id="couponLabel" style="display:none">কুপন / কোড *</label>
            <input type="text" class="input-field" id="couponCode" placeholder="🎟️ কুপন কোড দিন" style="display:none;">

            <div class="file-upload">
                <label>স্ক্রিনশট আপলোড করুন *</label>
                <input type="file" id="screenshot" accept="image/*">
                <small style="opacity:.55">📎 প্রমাণ হিসেবে স্ক্রিনশট আপলোড করুন</small>
            </div>

            <div class="rate-display">
                <h3>RATE</h3>
                <div id="rateDisplay">—</div>
                <div style="margin-top:10px">পরিমাণ: <span id="quantityDisplay">0</span> কয়েন</div>
                <div style="margin-top:5px">মোট পাবেন: <span class="total-amount" id="totalAmount">0.00</span> টাকা</div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitOrder()">সেল রিকোয়েস্ট পাঠান</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="active" onclick="navAction('market')"><span class="nav-icon">🏠</span>MARKET</button>
        <button onclick="navAction('history')"><span class="nav-icon">🕘</span>HISTORY</button>
        <button onclick="navAction('refer')"><span class="nav-icon">🎁</span>REFER</button>
        <button onclick="navAction('tutorial')"><span class="nav-icon">▶️</span>TUTORIAL</button>
        <button onclick="navAction('leaders')"><span class="nav-icon">🏆</span>LEADERS</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const CONFIG = {
            adminId: 7294314847,
            coins: [
                { id: "top", name: "TOP COIN", price: 4.7, rate: 1000, icon: "💗", enabled: true },
                { id: "ns", name: "NS COIN", price: 4.7, rate: 1000, icon: "👤", enabled: true },
                { id: "niva", name: "NIVA COIN", price: 4.7, rate: 1000, icon: "🪙", enabled: true }
            ],
            paymentMethods: [
                { id: "bikas", name: "Bikas", enabled: true },
                { id: "nogod", name: "Nogod", enabled: true },
                { id: "rokat", name: "Rockat", enabled: true }
            ]
        };
        
        let userData = null;
        let selectedCoin = null;
        let selectedMethod = null;
        let systemEnabled = true;
        
        // Initialize immediately - no waiting for API
        function init() {
            const u = tg.initDataUnsafe.user || {};
            document.getElementById('debugInfo').textContent = `[debug] TG SDK: found • ID: ${u.id || '—'}`;
            loadCoins();
            loadPaymentMethods();
            loadMenuItems();
            loadLiveMarketMenu();
            loadUser();
            
            // Select first coin by default
            const firstCard = document.querySelector('.coin-card');
            if (firstCard && CONFIG.coins.length > 0) {
                selectCoin(CONFIG.coins[0], firstCard);
            }
            
            // Try to load system status in background (non-blocking)
            loadSystemStatus();
            loadRemoteConfig();
        }
        
        // Loads coin/rate ON/OFF settings saved by the admin panel.
        // Falls back to local defaults when the API is unavailable.
        async function loadRemoteConfig() {
            try {
                const response = await fetch('/api/config', { cache: 'no-store' });
                if (!response.ok) return;
                const data = await response.json();
                if (!data.ok) return;
                if (Array.isArray(data.coins)) CONFIG.coins = data.coins;
                if (Array.isArray(data.paymentMethods)) CONFIG.paymentMethods = data.paymentMethods;
                if (data.appName) document.getElementById('appName').textContent = data.appName;
                loadCoins();
                loadPaymentMethods();
                const first = CONFIG.coins.find(c => c.enabled);
                if (first) {
                    const card = [...document.querySelectorAll('.coin-card')].find(c => c.classList.contains('selected'));
                    selectCoin(first, card || document.querySelector('.coin-card'));
                }
            } catch (e) {
                console.log('Config API unavailable; using local defaults.');
            }
        }

        async function loadSystemStatus() {
            try {
                const response = await fetch('/api/system-status');
                const data = await response.json();
                if (data.ok && data.status) {
                    systemEnabled = data.status.enabled !== false;
                    updateSystemUI();
                }
            } catch (error) {
                // API failed - keep system enabled by default
                console.log('System status API not available, using default');
            }
        }
        
        function updateSystemUI() {
            const statusEl = document.getElementById('systemStatus');
            const submitBtn = document.getElementById('submitBtn');
            
            if (systemEnabled) {
                statusEl.textContent = '● সিস্টেম সচল';
                statusEl.classList.remove('disabled');
                submitBtn.classList.remove('disabled');
                submitBtn.disabled = false;
            } else {
                statusEl.textContent = '✖ সিস্টেম বন্ধ';
                statusEl.classList.add('disabled');
                submitBtn.classList.add('disabled');
                submitBtn.disabled = true;
            }
        }
        
        function loadCoins() {
            const grid = document.getElementById('coinGrid');
            grid.innerHTML = '';

            CONFIG.coins.forEach((coin, index) => {
                const card = document.createElement('div');
                card.className = 'coin-card' + (!coin.enabled ? ' disabled' : '') + (index === 0 && coin.enabled ? ' selected' : '');
                card.innerHTML = `
                    <div class="coin-head">
                        <div class="coin-icon">${coin.icon || '🪙'}</div>
                        <div>
                            <div class="coin-name">${escapeHtml(coin.name)}</div>
                            <div class="coin-sub">MARKET ASSET</div>
                        </div>
                        <span class="online ${coin.enabled ? '' : 'off'}">${coin.enabled ? '● ONLINE' : '● OFFLINE'}</span>
                    </div>
                    <button class="sell-btn" ${coin.enabled ? '' : 'disabled'}>🪙 SELL COIN</button>
                `;
                if (coin.enabled) card.onclick = () => selectCoin(coin, card);
                grid.appendChild(card);
            });
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
            }[ch]));
        }

        function selectCoin(coin, element) {
            if (!coin.enabled) return;
            
            selectedCoin = coin;
            document.querySelectorAll('.coin-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            
            document.getElementById('rateDisplay').textContent = `${coin.price} টাকা / ${coin.rate} কয়েন`;
            calculateTotal();
            
            const couponField = document.getElementById('couponCode');
            couponField.style.display = coin.requiresCoupon ? 'block' : 'none';
            document.getElementById('couponLabel').style.display = coin.requiresCoupon ? 'block' : 'none';
        }
        
        function loadPaymentMethods() {
            const container = document.getElementById('paymentMethods');
            container.innerHTML = '';
            
            CONFIG.paymentMethods.forEach(method => {
                const btn = document.createElement('button');
                btn.className = 'payment-btn' + (!method.enabled ? ' disabled' : '');
                btn.textContent = method.name;
                btn.dataset.method = method.id;
                if (method.enabled) {
                    btn.onclick = () => selectPayment(method.id, btn);
                }
                container.appendChild(btn);
            });
        }
        
        function selectPayment(methodId, btn) {
            selectedMethod = methodId;
            document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        
        function calculateTotal() {
            if (!selectedCoin) return;
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const total = (selectedCoin.price * quantity / selectedCoin.rate).toFixed(2);
            document.getElementById('quantityDisplay').textContent = quantity;
            document.getElementById('totalAmount').textContent = total;
        }
        
        async function submitOrder() {
            if (!systemEnabled) {
                tg.showAlert('❌ সিস্টেম বর্তমানে বন্ধ আছে।');
                return;
            }
            if (!selectedCoin) { tg.showAlert('কয়েন সিলেক্ট করুন!'); return; }
            
            const instagramUsername = document.getElementById('instagramUsername').value;
            const quantity = document.getElementById('quantity').value;
            const accountNumber = document.getElementById('accountNumber').value;
            const couponCode = document.getElementById('couponCode').value;
            const screenshot = document.getElementById('screenshot').files[0];
            
            if (!instagramUsername) { tg.showAlert('Instagram ইউজারনেম দিন!'); return; }
            if (!quantity || quantity <= 0) { tg.showAlert('পরিমাণ লিখুন!'); return; }
            if (!selectedMethod) { tg.showAlert('পেমেন্ট মেথড সিলেক্ট করুন!'); return; }
            if (!accountNumber) { tg.showAlert('অ্যাকাউন্ট নাম্বার লিখুন!'); return; }
            if (selectedCoin.requiresCoupon && !couponCode) { tg.showAlert('কুপন কোড দিন!'); return; }
            if (!screenshot) { tg.showAlert('স্ক্রিনশট আপলোড করুন!'); return; }
            
            const totalAmount = (selectedCoin.price * quantity / selectedCoin.rate).toFixed(2);
            
            tg.showConfirm(
                `অর্ডার কনফার্ম:\n\nকয়েন: ${selectedCoin.name}\nপরিমাণ: ${quantity}\nমোট: ${totalAmount} টাকা`,
                async (confirmed) => {
                    if (confirmed) {
                        try {
                            const formData = new FormData();
                            formData.append('user_id', tg.initDataUnsafe.user?.id);
                            formData.append('username', tg.initDataUnsafe.user?.username || '');
                            formData.append('instagram_username', instagramUsername);
                            formData.append('coin', selectedCoin.id);
                            formData.append('quantity', quantity);
                            formData.append('price_per_rate', selectedCoin.price);
                            formData.append('total_amount', totalAmount);
                            formData.append('payment_method', selectedMethod);
                            formData.append('account_number', accountNumber);
                            formData.append('coupon_code', couponCode || '');
                            formData.append('screenshot', screenshot);
                            formData.append('timestamp', new Date().toISOString());
                            
                            const response = await fetch('/api/order', { method: 'POST', body: formData });
                            const result = await response.json();
                            
                            if (result.ok) {
                                tg.showAlert('✅ অর্ডার সফলভাবে জমা হয়েছে!');
                                resetForm();
                            } else {
                                tg.showAlert('❌ Error: ' + (result.error || 'Unknown'));
                            }
                        } catch (error) {
                            tg.showAlert('❌ Error: ' + error.message);
                        }
                    }
                }
            );
        }
        
        function resetForm() {
            document.getElementById('instagramUsername').value = '';
            document.getElementById('quantity').value = '1000';
            document.getElementById('accountNumber').value = '';
            document.getElementById('couponCode').value = '';
            document.getElementById('screenshot').value = '';
            document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
            selectedMethod = null;
            calculateTotal();
        }
        
        function loadMenuItems() {
            // Admin/dev button removed
        }

        function openLink(link) {
            if (window.Telegram?.WebApp?.openLink) tg.openLink(link);
            else window.open(link, '_blank');
        }

        function navAction(action) {
            const messages = {
                history:'History coming soon!',
                refer:'Refer coming soon!',
                tutorial:'Tutorial coming soon!',
                leaders:'Leaders coming soon!'
            };
            if (action === 'market') return window.scrollTo({top:0, behavior:'smooth'});
            tg.showAlert(messages[action] || 'Coming soon!');
        }

        async function loadUser() {
            try {
                const response = await fetch('/api/user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: tg.initDataUnsafe.user || {} })
                });
                const data = await response.json();
                userData = data.user;
                if (userData) {
                    document.getElementById('profileName').textContent = userData.first_name || userData.name || 'User';
                    document.getElementById('profileUsername').textContent = userData.username ? '@' + userData.username : '';
                    document.getElementById('approvedCount').textContent = userData.approved_count ?? 0;
                }
            } catch (error) {
                console.error('User load error:', error);
            }
        }
        
        function toggleMainMenu() {
            document.getElementById('mainMenu').classList.toggle('hidden');
        }
        
        function handleMenuAction(action) {
            const actions = {
                showMarket: () => document.getElementById('mainMenu').classList.add('hidden'),
                showHistory: () => tg.showAlert('History coming soon!'),
                showRefer: () => tg.showAlert('Refer coming soon!'),
                showTutorial: () => tg.showAlert('Tutorial coming soon!')
            };
            if (actions[action]) actions[action]();
        }
        
        // Run immediately
        init();
    </script>
</body>
</html>
