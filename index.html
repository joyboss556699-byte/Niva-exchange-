<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIVA EXCHANGE 💦</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #1e3c72;
            --secondary-color: #2a5298;
            --accent-color: #FFD700;
            --card-bg: rgba(255,255,255,0.1);
            --text-color: #ffffff;
            --button-bg: #4169E1;
            --button-hover: #1E90FF;
            --success-color: #4CAF50;
            --danger-color: #DC143C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-color);
            padding: 10px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        
        .status {
            background: var(--success-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 12px;
        }
        
        .status.disabled { background: var(--danger-color); }
        
        .mail-info {
            background: rgba(255,193,7,0.2);
            border: 1px solid #ffc107;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        
        .section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .section-title {
            margin: 15px 0 10px 0;
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
        }
        
        .coin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .coin-card {
            background: linear-gradient(135deg, #8B0000 0%, var(--danger-color) 100%);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }
        
        .coin-card:hover { transform: scale(1.05); }
        .coin-card.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .coin-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .coin-card h3 { font-size: 14px; margin-bottom: 5px; }
        .coin-card p { font-size: 11px; opacity: 0.9; }
        
        .input-field {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            background: rgba(255,255,255,0.9);
            color: #333;
        }
        
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .payment-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--button-bg);
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .payment-btn:hover, .payment-btn.active {
            background: var(--button-hover);
            transform: translateY(-2px);
        }
        
        .payment-btn.disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .file-upload { margin-bottom: 15px; }
        .file-upload label { display: block; margin-bottom: 8px; font-size: 14px; }
        .file-upload input[type="file"] {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.9);
            border-radius: 8px;
            color: #333;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-color) 0%, #FFA500 100%);
            border: none;
            border-radius: 10px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .submit-btn:hover:not(.disabled) { transform: scale(1.02); }
        .submit-btn.disabled { opacity: 0.5; cursor: not-allowed; }
        
        .rate-display {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }
        
        .rate-display h3 { color: var(--accent-color); margin-bottom: 10px; }
        .total-amount { font-size: 20px; font-weight: bold; color: var(--success-color); }
        
        .menu-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .menu-btn {
            padding: 12px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .menu-btn:hover { background: rgba(255,255,255,0.3); }
        
        .main-menu-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: var(--secondary-color);
            border: none;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .admin-btn {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%) !important;
            color: #1e3c72 !important;
        }
        
        .hidden { display: none; }
        
        .info-box {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="appName">NIVA EXCHANGE 💦</h1>
        <div class="status" id="systemStatus">● সিস্টেম সচল</div>
    </div>
    
    <div class="mail-info" id="mailInfo">
        📌 Mail link 100% acount craet ✅ : https://mailnesia.com/
    </div>
    
    <!-- XR7 Task System -->
    <div class="section" id="xr7TaskSection">
        <div class="section-title">✨ XR7 Task ✨</div>
        <div style="text-align: center; margin-bottom: 15px;">
            <strong>কয়েন সেল করুন • সহজে • দ্রুত</strong>
        </div>
        
        <!-- Form is visible by default now -->
        <div id="taskForm">
            <div class="section-title">কোন কয়েন বিক্রি করবেন?</div>
            <div class="coin-grid" id="coinGrid">
                <!-- Coins loaded dynamically -->
            </div>
            
            <div class="info-box" id="coinInfoBox">
                📋 ইউজারনেম কপি করুন
            </div>
            
            <label class="section-title">Instagram ইউজারনেম *</label>
            <input type="text" class="input-field" id="instagramUsername" placeholder=" Niva Coin সেল করতে আপনার Instagram ইউজারনেম দিন">
            
            <label class="section-title">পরিমাণ (কয়েন সংখ্যা)</label>
            <input type="number" class="input-field" id="quantity" value="1000" placeholder="কয়েন সংখ্যা লিখুন" oninput="calculateTotal()">
            
            <label class="section-title">পেমেন্ট মেথড</label>
            <div class="payment-methods" id="paymentMethods">
                <!-- Payment methods loaded dynamically -->
            </div>
            
            <label class="section-title">অ্যাকাউন্ট নাম্বার</label>
            <input type="text" class="input-field" id="accountNumber" placeholder="বিকাশ/নগদ/রকেট/ব্যাংক নাম্বার">
            
            <label class="section-title">কুপন / কোড *</label>
            <input type="text" class="input-field" id="couponCode" placeholder="🎟️ TOP Follow Coin সেল করতে আপনার কুপন কোড দিন" style="display:none;">
            
            <div class="file-upload">
                <label>স্ক্রিনশট আপলোড করুন *</label>
                <input type="file" id="screenshot" accept="image/*">
                <small style="opacity: 0.8;">📎 প্রমাণ হিসেবে স্ক্রিনশট আপলোড করুন</small>
            </div>
            
            <div class="rate-display">
                <h3>রেট</h3>
                <div id="rateDisplay">—</div>
                <div style="margin-top: 10px;">
                    <div>পরিমাণ: <span id="quantityDisplay">0</span> কয়েন</div>
                    <div style="margin-top: 5px;">মোট পাবেন: <span class="total-amount" id="totalAmount">0.00</span> টাকা</div>
                </div>
            </div>
            
            <button class="submit-btn" id="submitBtn" onclick="submitOrder()">
                সেল রিকোয়েস্ট পাঠান
            </button>
        </div>
    </div>
    
    <!-- Main Menu -->
    <div class="menu-section">
        <button class="main-menu-btn" onclick="toggleMainMenu()">
            🏠 MAIN MENU
        </button>
        
        <div id="mainMenu" class="hidden">
            <div id="menuItems"></div>
            
            <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                <h3 style="margin-bottom: 10px;">| LIVE MARKET</h3>
                <div class="menu-grid" id="liveMarketMenu"></div>
            </div>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const CONFIG = {
            adminId: 7294314847,
            coins: [
                { id: "xr7", name: "XR7 Task", price: 4.7, rate: 1000, icon: "✨", enabled: true },
                { id: "niva", name: "Niva Coin 🔗", price: 4.7, rate: 100, icon: "", enabled: true },
                { id: "topfollow", name: "TOP Follow Coin", price: 5, rate: 1000, icon: "", enabled: true, requiresCoupon: true }
            ],
            paymentMethods: [
                { id: "bikas", name: "Bikas", enabled: true },
                { id: "nogod", name: "Nogod", enabled: true },
                { id: "rokat", name: "Rockat", enabled: true }
            ]
        };
        
        let userData = null;
        let selectedCoin = null;
        let selectedMethod = null;
        let systemEnabled = true;
        
        // Initialize immediately - no waiting for API
        function init() {
            loadCoins();
            loadPaymentMethods();
            loadMenuItems();
            loadLiveMarketMenu();
            loadUser();
            
            // Select first coin by default
            const firstCard = document.querySelector('.coin-card');
            if (firstCard && CONFIG.coins.length > 0) {
                selectCoin(CONFIG.coins[0], firstCard);
            }
            
            // Try to load system status in background (non-blocking)
            loadSystemStatus();
        }
        
        async function loadSystemStatus() {
            try {
                const response = await fetch('/api/system-status');
                const data = await response.json();
                if (data.ok && data.status) {
                    systemEnabled = data.status.enabled !== false;
                    updateSystemUI();
                }
            } catch (error) {
                // API failed - keep system enabled by default
                console.log('System status API not available, using default');
            }
        }
        
        function updateSystemUI() {
            const statusEl = document.getElementById('systemStatus');
            const submitBtn = document.getElementById('submitBtn');
            
            if (systemEnabled) {
                statusEl.textContent = '● সিস্টেম সচল';
                statusEl.classList.remove('disabled');
                submitBtn.classList.remove('disabled');
                submitBtn.disabled = false;
            } else {
                statusEl.textContent = '✖ সিস্টেম বন্ধ';
                statusEl.classList.add('disabled');
                submitBtn.classList.add('disabled');
                submitBtn.disabled = true;
            }
        }
        
        function loadCoins() {
            const grid = document.getElementById('coinGrid');
            grid.innerHTML = '';
            
            CONFIG.coins.forEach((coin, index) => {
                const card = document.createElement('div');
                card.className = 'coin-card' + (!coin.enabled ? ' disabled' : '') + (index === 0 ? ' selected' : '');
                card.innerHTML = `
                    <h3>${coin.name}</h3>
                    <p>${coin.price} টাকা (প্রতি ${coin.rate})</p>
                `;
                if (coin.enabled) {
                    card.onclick = () => selectCoin(coin, card);
                }
                grid.appendChild(card);
            });
        }
        
        function selectCoin(coin, element) {
            if (!coin.enabled) return;
            
            selectedCoin = coin;
            document.querySelectorAll('.coin-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            
            document.getElementById('rateDisplay').textContent = `${coin.price} টাকা / ${coin.rate} কয়েন`;
            calculateTotal();
            
            const couponField = document.getElementById('couponCode');
            couponField.style.display = coin.requiresCoupon ? 'block' : 'none';
        }
        
        function loadPaymentMethods() {
            const container = document.getElementById('paymentMethods');
            container.innerHTML = '';
            
            CONFIG.paymentMethods.forEach(method => {
                const btn = document.createElement('button');
                btn.className = 'payment-btn' + (!method.enabled ? ' disabled' : '');
                btn.textContent = method.name;
                btn.dataset.method = method.id;
                if (method.enabled) {
                    btn.onclick = () => selectPayment(method.id, btn);
                }
                container.appendChild(btn);
            });
        }
        
        function selectPayment(methodId, btn) {
            selectedMethod = methodId;
            document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        
        function calculateTotal() {
            if (!selectedCoin) return;
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const total = (selectedCoin.price * quantity / selectedCoin.rate).toFixed(2);
            document.getElementById('quantityDisplay').textContent = quantity;
            document.getElementById('totalAmount').textContent = total;
        }
        
        async function submitOrder() {
            if (!systemEnabled) {
                tg.showAlert('❌ সিস্টেম বর্তমানে বন্ধ আছে।');
                return;
            }
            if (!selectedCoin) { tg.showAlert('কয়েন সিলেক্ট করুন!'); return; }
            
            const instagramUsername = document.getElementById('instagramUsername').value;
            const quantity = document.getElementById('quantity').value;
            const accountNumber = document.getElementById('accountNumber').value;
            const couponCode = document.getElementById('couponCode').value;
            const screenshot = document.getElementById('screenshot').files[0];
            
            if (!instagramUsername) { tg.showAlert('Instagram ইউজারনেম দিন!'); return; }
            if (!quantity || quantity <= 0) { tg.showAlert('পরিমাণ লিখুন!'); return; }
            if (!selectedMethod) { tg.showAlert('পেমেন্ট মেথড সিলেক্ট করুন!'); return; }
            if (!accountNumber) { tg.showAlert('অ্যাকাউন্ট নাম্বার লিখুন!'); return; }
            if (selectedCoin.requiresCoupon && !couponCode) { tg.showAlert('কুপন কোড দিন!'); return; }
            if (!screenshot) { tg.showAlert('স্ক্রিনশট আপলোড করুন!'); return; }
            
            const totalAmount = (selectedCoin.price * quantity / selectedCoin.rate).toFixed(2);
            
            tg.showConfirm(
                `অর্ডার কনফার্ম:\n\nকয়েন: ${selectedCoin.name}\nপরিমাণ: ${quantity}\nমোট: ${totalAmount} টাকা`,
                async (confirmed) => {
                    if (confirmed) {
                        try {
                            const formData = new FormData();
                            formData.append('user_id', tg.initDataUnsafe.user?.id);
                            formData.append('username', tg.initDataUnsafe.user?.username || '');
                            formData.append('instagram_username', instagramUsername);
                            formData.append('coin', selectedCoin.id);
                            formData.append('quantity', quantity);
                            formData.append('price_per_rate', selectedCoin.price);
                            formData.append('total_amount', totalAmount);
                            formData.append('payment_method', selectedMethod);
                            formData.append('account_number', accountNumber);
                            formData.append('coupon_code', couponCode || '');
                            formData.append('screenshot', screenshot);
                            formData.append('timestamp', new Date().toISOString());
                            
                            const response = await fetch('/api/order', { method: 'POST', body: formData });
                            const result = await response.json();
                            
                            if (result.ok) {
                                tg.showAlert('✅ অর্ডার সফলভাবে জমা হয়েছে!');
                                resetForm();
                            } else {
                                tg.showAlert('❌ Error: ' + (result.error || 'Unknown'));
                            }
                        } catch (error) {
                            tg.showAlert('❌ Error: ' + error.message);
                        }
                    }
                }
            );
        }
        
        function resetForm() {
            document.getElementById('instagramUsername').value = '';
            document.getElementById('quantity').value = '1000';
            document.getElementById('accountNumber').value = '';
            document.getElementById('couponCode').value = '';
            document.getElementById('screenshot').value = '';
            document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('active'));
            selectedMethod = null;
            calculateTotal();
        }
        
        function loadMenuItems() {
            const container = document.getElementById('menuItems');
            const menuItems = [
                { icon: "🎧", text: "Help Line - 24/7 Support", link: "https://t.me/Sapportotp" },
                { icon: "📢", text: "Channel - News & Updates", link: "https://t.me/yourchannel" }
            ];
            
            menuItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'main-menu-btn';
                btn.innerHTML = `${item.icon} ${item.text}`;
                btn.onclick = () => tg.openLink(item.link);
                container.appendChild(btn);
            });
            
            const userId = tg.initDataUnsafe.user?.id;
            if (userId === CONFIG.adminId) {
                const adminBtn = document.createElement('button');
                adminBtn.className = 'main-menu-btn admin-btn';
                adminBtn.innerHTML = '👨‍ ADMIN PANEL';
                adminBtn.onclick = openAdminPanel;
                container.appendChild(adminBtn);
            }
        }
        
        function loadLiveMarketMenu() {
            const container = document.getElementById('liveMarketMenu');
            const items = [
                { icon: "", text: "MARKET", action: "showMarket" },
                { icon: "🕘", text: "HISTORY", action: "showHistory" },
                { icon: "🎁", text: "REFER", action: "showRefer" },
                { icon: "▶️", text: "TUTORIAL", action: "showTutorial" }
            ];
            
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerHTML = `${item.icon} ${item.text}`;
                btn.onclick = () => handleMenuAction(item.action);
                container.appendChild(btn);
            });
        }
        
        async function loadUser() {
            try {
                const response = await fetch('/api/user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: tg.initDataUnsafe.user || {} })
                });
                const data = await response.json();
                userData = data.user;
            } catch (error) {
                console.error('User load error:', error);
            }
        }
        
        function toggleMainMenu() {
            document.getElementById('mainMenu').classList.toggle('hidden');
        }
        
        function openAdminPanel() {
            const userId = tg.initDataUnsafe.user?.id;
            window.open('/admin/panel?uid=' + userId, '_blank');
        }
        
        function handleMenuAction(action) {
            const actions = {
                showMarket: () => document.getElementById('mainMenu').classList.add('hidden'),
                showHistory: () => tg.showAlert('History coming soon!'),
                showRefer: () => tg.showAlert('Refer coming soon!'),
                showTutorial: () => tg.showAlert('Tutorial coming soon!')
            };
            if (actions[action]) actions[action]();
        }
        
        // Run immediately
        init();
    </script>
</body>
</html>
